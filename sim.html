<body><style>body{background-color:#2f303d}.container{display:flex;justify-content:center}.cell{width:50px;height:50px;border:1px solid #6d5ecc}h1{text-align:center}p{text-align:center}</style><h1>Turing Machine Simulator</h1><p>Enter a TM:</p><div class=container><input id=tm type=text placeholder="1RB1RZ_0LA---" style="background-color: #6d5ecc;"></div><div class=container style="margin-top: 2%;"><button type=button onclick=simulate() style="background-color: #6d5ecc;">Simulate</button></div><div id=tape style="display: flex; justify-content: center; margin-top: 2%;"><div class=cell><p id=cell-5>0</p></div><div class=cell><p id=cell-4>0</p></div><div class=cell><p id=cell-3>0</p></div><div class=cell><p id=cell-2>0</p></div><div class=cell><p id=cell-1>0</p></div><div class=cell><p id=cell0>0</p></div><div class=cell><p id=cell1>0</p></div><div class=cell><p id=cell2>0</p></div><div class=cell><p id=cell3>0</p></div><div class=cell><p id=cell4>0</p></div><div class=cell><p id=cell5>0</p></div></div><div id=labels style="display: flex; justify-content: center; gap: 35%;"><p id=leftmost>-5</p><p id=rightmost>5</p></div><p id=haltingsteps></p><script>function simulate(){let t=parseInt(prompt("How many steps? ")),e=parseInt(prompt("How many milliseconds? ")),n=document.getElementById("tm").value,o=n.split("_"),l=[0,0,0],m=1,s=1,i=0,d=0,u=m-s;!function c(){let p;if(p=0==l[m]?o[d].slice(0,3):o[d].slice(3,6),"---"===p)return void(document.getElementById("haltingsteps").textContent=`TM ${n} after ${i} steps.`);let r=p.split("");l[m]=Number(r[0]),"R"==r[1]?m+=1:"L"==r[1]&&(m-=1),m==l.length&&l.push(0),m<0&&(l.unshift(0),s+=1,m+=1),i+=1,d=r[2].charCodeAt(0)-"A".charCodeAt(0),u=m-s,document.getElementById("leftmost").textContent=u-5,document.getElementById("rightmost").textContent=u+5;for(let t=-5;t<=5;t+=1)document.getElementById("cell"+t).textContent=l[m+t]||0;i<t&&setTimeout(c,e)}()}</script></body>
